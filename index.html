<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      color: #1c1e21;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .profile-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      overflow: hidden;
    }

    .profile-banner {
      height: 140px;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -56px;
      padding: 0 1.5rem;
    }

    .profile-avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background-color: #e4e6eb;
      object-fit: cover;
    }

    .profile-name {
      margin-top: 0.75rem;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .profile-handle {
      color: #65676b;
      font-size: 0.9rem;
      margin-top: 0.15rem;
    }

    .profile-bio {
      text-align: center;
      color: #444;
      font-size: 0.95rem;
      line-height: 1.5;
      padding: 0.75rem 1.5rem 0;
    }

    .profile-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.25rem 1.5rem;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #65676b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .profile-links {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0 1.5rem 1.5rem;
    }

    .profile-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      border: 1px solid #e4e6eb;
      border-radius: 10px;
      text-decoration: none;
      color: #1c1e21;
      font-size: 0.9rem;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .profile-link:hover {
      background-color: #f0f2f5;
      border-color: #ccc;
    }

    .profile-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: #65676b;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="profile-banner"></div>

    <div class="profile-header">
      <img
        class="profile-avatar"
        src="https://i.pravatar.cc/224"
        alt="User avatar"
      />
      <h1 class="profile-name">Alex Johnson</h1>
      <p class="profile-handle">@alexjohnson</p>
    </div>

    <p class="profile-bio">
      Full-stack developer &amp; open-source enthusiast. Building things that
      make the web a better place.
    </p>

    <div class="profile-stats">
      <div class="stat">
        <div class="stat-value">128</div>
        <div class="stat-label">Posts</div>
      </div>
      <div class="stat">
        <div class="stat-value">4.2k</div>
        <div class="stat-label">Followers</div>
      </div>
      <div class="stat">
        <div class="stat-value">312</div>
        <div class="stat-label">Following</div>
      </div>
    </div>

    <nav class="profile-links">
      <a class="profile-link" href="https://github.com" target="_blank" rel="noopener noreferrer">

        GitHub
      </a>
      <a class="profile-link" href="https://twitter.com" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M23.95 4.57a10 10 0 0 1-2.83.77 4.96 4.96 0 0 0 2.17-2.72c-.95.56-2 .96-3.13 1.18a4.92 4.92 0 0 0-8.39 4.49A13.94 13.94 0 0 1 1.64 3.16a4.93 4.93 0 0 0 1.52 6.57 4.9 4.9 0 0 1-2.23-.61v.06a4.93 4.93 0 0 0 3.95 4.83 4.94 4.94 0 0 1-2.22.08 4.93 4.93 0 0 0 4.6 3.42A9.87 9.87 0 0 1 0 19.54a13.94 13.94 0 0 0 7.55 2.21c9.06 0 14.01-7.5 14.01-14.01 0-.21 0-.42-.02-.63A10 10 0 0 0 24 4.59l-.05-.02z"/></svg>

      <a class="profile-link" href="mailto:alex@example.com">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        alex@example.com
      </a>
    </nav>
  </main>
</body>
</html>
